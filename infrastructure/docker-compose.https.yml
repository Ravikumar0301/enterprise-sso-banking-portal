services:
  postgres:
    image: postgres:15-alpine
    container_name: sso-postgres-https
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - postgres_https_data:/var/lib/postgresql/data
    networks:
      - sso-https-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5
    container_name: sso-keycloak-https
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin123}"

      KC_HTTP_ENABLED: "false"
      KC_HOSTNAME: "https://localhost:18080"
      KC_HOSTNAME_STRICT: "true"

      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/conf/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/conf/server.key

      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123

    ports:
      - "127.0.0.1:18080:8443"

    volumes:
      - ../certs/banking-server.crt:/opt/keycloak/conf/server.crt:ro
      - ../certs/banking-server.key:/opt/keycloak/conf/server.key:ro
      - ./keycloak/fluxnova-realm.json:/opt/keycloak/data/import/fluxnova-realm.json:ro

    networks:
      - sso-https-network

volumes:
  postgres_https_data:

networks:
  sso-https-network:
    driver: bridge